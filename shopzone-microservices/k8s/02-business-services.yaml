# ============================================================
#  Business services: user, product, cart, order, payment,
#  notification, search  (7 Deployments + 7 Services)
#  apply AFTER discovery-server is Ready:
#     kubectl apply -f 02-business-services.yaml
#
#  Every service:
#   - envFrom shopzone-config  -> EUREKA_URI, KAFKA_BOOTSTRAP_SERVERS,
#                                 SPRING_DATASOURCE_USERNAME, JAVA_TOOL_OPTIONS
#   - datastore host overridden to host.minikube.internal via env
#     (Spring env vars override the hardcoded localhost in application.yml)
#   - TCP probes (see README for why not HTTP /actuator/health)
#   - K8s Service on port 80 -> container port, so http://<name> resolves
#     for any plain-DNS inter-service call; Eureka handles the rest.
# ============================================================

# ============================ user-service (8081, Postgres) ============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopzone
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: shopzone/user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: shopzone-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://host.minikube.internal:5432/shopzone_users"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: JWT_SECRET
          startupProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopzone
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 80
      targetPort: 8081
  type: ClusterIP

# ============================ product-service (8082, MongoDB + Kafka + Cloudinary) ============================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopzone
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: shopzone/product-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: shopzone-config
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://host.minikube.internal:27017/shopzone_products"
            - name: CLOUDINARY_CLOUD_NAME
              value: "dgqv8qsi5"          # not secret; appears in every Cloudinary URL
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: CLOUDINARY_API_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: JWT_SECRET
          startupProbe:
            tcpSocket: { port: 8082 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 8082 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8082 }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopzone
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 80
      targetPort: 8082
  type: ClusterIP

