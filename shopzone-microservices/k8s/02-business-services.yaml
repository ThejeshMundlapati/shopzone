# ============================ notification-service (8086, Postgres + Kafka consumer + Mail) ============================
# No JWT (its application.yml has no jwt block) and no gateway route -- it is
# event-driven (Kafka consumer). It still registers with Eureka.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shopzone
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: shopzone/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: shopzone-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://host.minikube.internal:5432/shopzone_notifications"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MAIL_HOST
              value: "sandbox.smtp.mailtrap.io"
            - name: MAIL_PORT
              value: "2525"
            - name: MAIL_FROM
              value: "noreply@shopzone.com"
            - name: APP_BASE_URL
              value: "http://localhost:3000"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopzone-secrets
                  key: MAIL_PASSWORD
          startupProbe:
            tcpSocket: { port: 8086 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 8086 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8086 }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shopzone
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 80
      targetPort: 8086
  type: ClusterIP

